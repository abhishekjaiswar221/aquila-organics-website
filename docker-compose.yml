# Dev-only Postgres. Credentials are local placeholders, never used in production.
services:
  postgres:
    image: postgres:16
    container_name: aquila-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aquila
      POSTGRES_PASSWORD: aquila_dev_password
      POSTGRES_DB: aquila
    ports:
      - "5432:5432"
    volumes:
      - aquila_pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aquila -d aquila"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  aquila_pgdata:
